name: Probe feeds
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the candidate endpoints
        run: |
          urls=(
            "https://services.swpc.noaa.gov/products/geospace/propagated-solar-wind-1-hour.json"
            "https://services.swpc.noaa.gov/products/geospace/propagated-solar-wind.json"
            "https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_5m.json"
            "https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_5m.json"
            "https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1h.json"
            "https://services.swpc.noaa.gov/products/summary/solar-wind-plasma.json"
            "https://services.swpc.noaa.gov/products/noaa-scales.json"
          )
          for u in "${urls[@]}"; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' -m 25 "$u" || echo ERR)
            echo "=== $code  $u"
            if [ "$code" = "200" ]; then head -c 520 /tmp/body; echo; echo "   [bytes: $(wc -c < /tmp/body)]"; fi
          done
          echo "=== CORS header on the forecast endpoint"
          curl -s -I -m 20 "https://services.swpc.noaa.gov/products/noaa-planetary-k-index-forecast.json" | grep -i -E "access-control|content-type" || true
          echo "=== open-meteo"
          curl -s -m 25 "https://api.open-meteo.com/v1/forecast?latitude=53.17,52.37&longitude=4.88,4.90&hourly=cloud_cover,cloud_cover_low,visibility&timezone=UTC&forecast_days=2" | head -c 400; echo
