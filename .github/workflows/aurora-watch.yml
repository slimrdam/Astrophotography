name: Aurora watch

# Scores the next three nights over the Netherlands and opens an issue when
# they line up. GitHub emails you the issue, which is the "tell me" part.
on:
  schedule:
    - cron: '0 8 * * *'    # 09:00/10:00 local — tomorrow's outlook
    - cron: '0 15 * * *'   # 16:00/17:00 local — decision time for tonight
  workflow_dispatch:
    inputs:
      threshold:
        description: 'Score (0-100) that counts as "go"'
        required: false
        default: '65'

permissions:
  contents: write
  issues: write

concurrency:
  group: aurora-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Score the next three nights
        id: aurora
        run: node scripts/check-aurora.js --threshold "${{ github.event.inputs.threshold || '65' }}"

      - name: Commit the snapshot
        if: steps.aurora.outputs.ok == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
          else
            git commit -m "data: aurora snapshot ${{ steps.aurora.outputs.date_key }} (best ${{ steps.aurora.outputs.score }}/100) [skip ci]"
            git push
          fi

      - name: Open an issue when the conditions align
        if: steps.aurora.outputs.alert == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.aurora.outputs.title }}
          BODY: ${{ steps.aurora.outputs.body }}
          DATE_KEY: ${{ steps.aurora.outputs.date_key }}
        run: |
          set -euo pipefail
          MARKER="aurora-watch:${DATE_KEY}"
          FOOTER='_Generated by [Claude Code](https://claude.ai/code)_'
          BODY_FULL=$(printf '%s\n\n<!-- %s -->\n\n---\n%s\n' "${BODY}" "${MARKER}" "${FOOTER}")
          EXISTING=$(gh issue list --state all --search "\"${MARKER}\" in:body" --json number --jq '.[0].number // empty')
          gh label create aurora --color 2ee59d --description "Aurora hunting conditions" 2>/dev/null || true
          if [ -n "${EXISTING}" ]; then
            echo "Updating issue #${EXISTING} for ${DATE_KEY}"
            gh issue edit "${EXISTING}" --title "${TITLE}" --body "${BODY_FULL}"
          else
            gh issue create --title "${TITLE}" --body "${BODY_FULL}" --label aurora
          fi

      - name: Summary
        if: always()
        run: echo "${{ steps.aurora.outputs.summary || 'no summary produced' }}" >> "$GITHUB_STEP_SUMMARY"
